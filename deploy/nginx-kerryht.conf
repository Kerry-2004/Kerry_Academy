# Nginx — Kerryht Academy sur le sous-domaine school.kerryht.com (un seul VPS).
# Tout passe par le même sous-domaine :
#   school.kerryht.com/            -> Next.js (frontend)  127.0.0.1:3000
#   school.kerryht.com/api/        -> Django/Gunicorn     127.0.0.1:8000
#   school.kerryht.com/admin/      -> Django (admin)
#   school.kerryht.com/ckeditor5/  -> Django (éditeur de texte)
#   school.kerryht.com/static/     -> fichiers statiques (servis par Nginx)
#   school.kerryht.com/media/      -> vidéos/images uploadées (servis par Nginx)
#
# Remplacez "deploy" par votre utilisateur si besoin. À placer dans
# /etc/nginx/sites-available/kerryht puis lier dans sites-enabled.
# Certbot ajoutera automatiquement le bloc HTTPS (443) et la redirection.

server {
    listen 80;
    server_name school.kerryht.com;

    # Autorise l'upload de grosses vidéos depuis l'admin Django (~1 Go).
    client_max_body_size 1024M;

    # --- Backend Django ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ckeditor5/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Fichiers statiques Django (admin, CKEditor, Unfold) ---
    location /static/ {
        alias /home/deploy/kerryht-academy/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --- Fichiers média (vidéos, images). Nginx gère nativement le Range
    #     -> l'avance/recul des vidéos fonctionne parfaitement. ---
    location /media/ {
        alias /home/deploy/kerryht-academy/backend/media/;
        access_log off;
    }

    # --- Frontend Next.js (tout le reste) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
