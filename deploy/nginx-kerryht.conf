# Nginx — Kerryht Academy (un seul VPS)
#   kerryht.com / www.kerryht.com  -> Next.js (127.0.0.1:3000)
#   api.kerryht.com                -> Django/Gunicorn (127.0.0.1:8000)
#
# Remplacez "kerryht.com" par votre domaine et "deploy" par votre utilisateur.
# À placer dans /etc/nginx/sites-available/kerryht puis lier dans sites-enabled.
# Certbot ajoutera automatiquement les blocs SSL (443) et la redirection HTTPS.

# --- Frontend ---
server {
    listen 80;
    server_name kerryht.com www.kerryht.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- Backend / API ---
server {
    listen 80;
    server_name api.kerryht.com;

    # Autorise l'upload de grosses vidéos depuis l'admin Django.
    client_max_body_size 1024M;

    # Fichiers statiques (admin, CKEditor, Unfold) servis directement par Nginx.
    location /static/ {
        alias /home/deploy/kerryht-academy/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Fichiers média (vidéos, images uploadées). Nginx gère nativement les
    # requêtes Range -> l'avance/recul des vidéos fonctionne parfaitement.
    location /media/ {
        alias /home/deploy/kerryht-academy/backend/media/;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
