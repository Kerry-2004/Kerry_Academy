# Blueprint Render pour le backend Django (frontend déployé séparément sur Vercel).
# Render → New → Blueprint → connecter ce dépôt : il lit ce fichier automatiquement.
databases:
  - name: kerryht-db
    databaseName: kerryht_academy
    user: kerryht
    plan: free

services:
  - type: web
    name: kerryht-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      # Choisir une version Python supportée par Render (3.12.x recommandé).
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      # SECRET_KEY généré et gardé secret par Render.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Connexion PostgreSQL injectée depuis la base ci-dessus.
      - key: DATABASE_URL
        fromDatabase:
          name: kerryht-db
          property: connectionString
      # À renseigner dans le dashboard Render une fois les domaines connus
      # (ex. kerryht-backend.onrender.com,api.kerryht.com).
      - key: ALLOWED_HOSTS
        sync: false
      # Origine du frontend Vercel (ex. https://kerryht.com,https://www.kerryht.com).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Frontend (Vercel) et backend (Render) sur des domaines racine différents :
      # le cookie de refresh doit être SameSite=None pour être envoyé en cross-site.
      - key: REFRESH_COOKIE_SAMESITE
        value: "None"
